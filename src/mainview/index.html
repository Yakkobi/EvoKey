<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoKey</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/evokey-logo.png" alt="EvoKey" class="logo" />
    </header>

    <main id="mainMenu" class="visible">
      <p id="keyComboDisplay">Ctrl + Alt + :]</p>
      <button id="macrosButton">Macros</button>
      <button id="settingsButton">Settings</button>
      <button id="importButton">Import</button>
      <button id="exportButton">Export</button>
    </main>

    <main id="macrosMenu" class="visible hidden">
      <h2>Your Macros</h2>
      <button class="mainMenuButton" data-target="mainMenu">Main Menu</button>
      <ul id="macroList"></ul>
    </main>

    <main id="settingsMenu" class="visible hidden">
      <h2>Settings</h2>
      <button class="mainMenuButton" data-target="mainMenu">Main Menu</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
