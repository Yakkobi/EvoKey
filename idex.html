<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoKey</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/evokey-logo.png" alt="EvoKey" class="evokeyLogo" />
    </header>

    <div class="mainMenuButtonsContainer">
      <main id="viewMain" class="view">
        <button id="macrosButton">Macros</button>
        <button id="settingsButton">Settings</button>
        <button id="openJsonButton">Open JSON</button>
      </main>
    </div>

    <main id="viewMacros" class="view hidden">
      <h2>Your Macros</h2>
      <button class="backButton" data-target="viewMain">&larr; Back</button>
      <ul id="macro-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
