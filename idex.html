<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoKey</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="assets/evokey-logo.png" alt="EvoKey" class="logo" />
    </header>

    <main id="mainMenu" class="view">
      <button id="macrosButton">Macros</button>
      <button id="settingsButton">Settings</button>
      <button id="openJsonButton">Open JSON</button>
    </main>

    <main id="macrosMenu" class="view hidden">
      <h2>Your Macros</h2>
      <button class="backButton" data-target="mainMenu">&larr; Back</button>
      <ul id="macroList"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
